name: Auto-Publish In-Depth SEO/GEO Matrix Articles

on:
  schedule:
    # 每 4 天自动执行一次 (北京时间上午 10:00，对应 UTC 02:00)
    - cron: '0 2 */4 * *'
  workflow_dispatch:
    inputs:
      topic:
        description: '可选：指定自定文章标题/主题 (留空则按 URL 防批量系统轮换选题)'
        required: false
        type: string
        default: ''
      slug:
        description: '可选：自定语义化英文 Slug (如: cross-border-remote-work-network-resilience)'
        required: false
        type: string
        default: ''
      dry_run:
        description: '模拟测试运行 (不调用 DeepSeek API，快速验证构建流水线)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publish-article:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Deep SEO/GEO Article via DeepSeek API
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ github.event.inputs.topic }}" ]; then
            ARGS="$ARGS --topic=\"${{ github.event.inputs.topic }}\""
          fi
          if [ -n "${{ github.event.inputs.slug }}" ]; then
            ARGS="$ARGS --slug=\"${{ github.event.inputs.slug }}\""
          fi
          node scripts/generate-weekly-article.mjs $ARGS

      - name: Run SEO & GEO Quality Gate Validation
        run: npm run validate

      - name: Commit and Push to Main
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "没有产生新的内容文件"
          else
            git commit -m "feat(content): 自动发布深度 SEO/GEO 矩阵文章并同步上线"
            git push origin main
          fi
